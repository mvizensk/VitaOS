name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: VitaOS
        run: |
          mkdir build && cd build
          cmake ..
          make -j"$(nproc)"
      - name: PS plugin
        run: |
          mkdir plugin/build && cd plugin/build
          cmake ..
          make
      - uses: actions/upload-artifact@v4
        with:
          name: vitaos
          path: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
