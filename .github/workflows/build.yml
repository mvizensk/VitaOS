name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      # The image's prebuilt curl was compiled against older OpenSSL headers
      # than the OpenSSL it ships, so VitaOS would not link. Rebuild curl with
      # vitasdk's own recipe against the image's OpenSSL.
      - name: curl
        run: |
          cd /tmp
          wget -q https://github.com/curl/curl/releases/download/curl-8_17_0/curl-8.17.0.tar.gz
          echo "e8e74cdeefe5fb78b3ae6e90cd542babf788fa9480029cfcee6fd9ced42b7910  curl-8.17.0.tar.gz" | sha256sum -c -
          tar xzf curl-8.17.0.tar.gz && mkdir curl-8.17.0/build && cd curl-8.17.0/build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_INSTALL_PREFIX=$VITASDK/arm-vita-eabi \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-DOPENSSL_NO_UI_CONSOLE" -DCURL_USE_OPENSSL=ON \
            -DBUILD_CURL_EXE=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DENABLE_IPV6=OFF -DCURL_DISABLE_SOCKETPAIR=ON \
            -DHAVE_FCNTL_O_NONBLOCK=OFF -DENABLE_THREADED_RESOLVER=OFF -DBUILD_LIBCURL_DOCS=OFF -DBUILD_MISC_DOCS=OFF \
            -DENABLE_CURL_MANUAL=OFF -DCURL_CA_BUNDLE="vs0:data/external/cert/CA_LIST.cer" -DCURL_USE_LIBPSL=OFF
          sed -i '/HAVE_PIPE2/d' lib/curl_config.h
          make -j"$(nproc)" && make install
      - name: VitaOS
        run: |
          mkdir build && cd build
          cmake ..
          make -j"$(nproc)"
      - name: PS plugin
        run: |
          mkdir plugin/build && cd plugin/build
          cmake ..
          make
      - uses: actions/upload-artifact@v4
        with:
          name: vitaos
          path: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VitaOS.vpk
            plugin/build/vitaos_ps.suprx
